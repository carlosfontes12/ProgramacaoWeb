<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

<fieldset>
    <legend>Formulário de Contacto CESAE</legend>

<form action="#" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required placeholder="Insira o seu nome aqui">

    <br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" >
    
    <br>
    <br>

    <label for="Género">Género:</label>

    <br>
    
    <input type="radio" id="masculino" name="Género" value="Masculino">
    <span>Masculino</span>

    <br>

    <input type="radio" id="feminino" name="Género" value="Feminino">
    <span>Feminino</span>

    <br>
    <br>

    <label for="data atual">Data Atual:</label>
    <input type="date" id="data atual" name="data atual">

    <br>

    <label for="Turma"> Turma:</label>
    <select id="Turma" name="Turma">
        <option value="Turma A">Web Developer & Mobile</option>
        <option value="Turma B">Outra</option>
        <
    </select>

    <br>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" rows="3" cols="30"></textarea>
    <br>
    <input type="reset" value="Limpar">
    <input type="submit" value="Enviar">
</form>





</fieldset>
</body>
</html>
